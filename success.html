<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | Sinatra Headwear</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #000; color: #fff; font-family: 'Inter', sans-serif; text-align: center; padding: 60px 20px;">

  <div style="max-width: 520px; margin: 0 auto; border: 1px solid #222; padding: 40px; border-radius: 8px; background: #111;">
    <div style="font-size: 3rem; color: #25D366; margin-bottom: 10px;">✓</div>
    <h1 style="color: #fff; font-size: 2rem; margin-bottom: 10px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;">PAYMENT SUCCESSFUL!</h1>
    <p style="color: #aaa; font-size: 0.95rem; line-height: 1.5;" id="statusMsg">Confirming your payment and sending your order receipt...</p>
    
    <a href="index.html" style="display: inline-block; padding: 14px 28px; background: #fff; color: #000; text-decoration: none; font-weight: 700; border-radius: 4px; margin-top: 25px; letter-spacing: 0.5px;">RETURN TO HOME</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const statusMsg = document.getElementById("statusMsg");
      const pendingOrder = localStorage.getItem("pendingSinatraOrder");

      if (pendingOrder) {
        try {
          const orderData = JSON.parse(pendingOrder);

          // Send Email via Web3Forms API
          const response = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(orderData)
          });

          if (response.ok) {
            statusMsg.innerHTML = "Thank you! Your payment was verified and an order receipt has been emailed to you.";
          } else {
            statusMsg.innerHTML = "Thank you for your order! Your payment was successful.";
          }
        } catch (error) {
          console.error("Error sending order email:", error);
          statusMsg.innerHTML = "Thank you! Your order has been placed successfully.";
        } finally {
          // Clear cart and pending order storage after email dispatch
          localStorage.removeItem("pendingSinatraOrder");
          localStorage.removeItem("sinatra_cart");
        }
      } else {
        statusMsg.innerHTML = "Thank you for shopping with Sinatra Headwear!";
      }
    });
  </script>
</body>
</html>
