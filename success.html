<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payment Successful | Sinatra Headwear
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body
  style="
    background:#000;
    color:#fff;
    font-family:'Inter',sans-serif;
    text-align:center;
    padding:60px 20px;
  "
>

  <div
    style="
      max-width:520px;
      margin:0 auto;
      border:1px solid #222;
      padding:40px;
      border-radius:8px;
      background:#111;
    "
  >
    <div
      style="
        font-size:3rem;
        color:#25D366;
        margin-bottom:10px;
      "
    >
      ✓
    </div>

    <h1
      style="
        color:#fff;
        font-size:2rem;
        margin-bottom:10px;
        font-family:'Bebas Neue',sans-serif;
        letter-spacing:1px;
      "
    >
      PAYMENT SUCCESSFUL!
    </h1>

    <p
      id="statusMsg"
      style="
        color:#aaa;
        font-size:.95rem;
        line-height:1.5;
      "
    >
      Confirming your order...
    </p>

    <a
      href="index.html"
      style="
        display:inline-block;
        padding:14px 28px;
        background:#fff;
        color:#000;
        text-decoration:none;
        font-weight:700;
        border-radius:4px;
        margin-top:25px;
        letter-spacing:.5px;
      "
    >
      RETURN TO HOME
    </a>
  </div>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        const statusMsg =
          document.getElementById(
            "statusMsg"
          );

        const pendingOrder =
          localStorage.getItem(
            "pendingSinatraOrder"
          );

        if (!pendingOrder) {
          statusMsg.innerHTML =
            "Thank you for shopping with Sinatra Headwear!";

          return;
        }

        try {
          const orderData =
            JSON.parse(
              pendingOrder
            );

          const web3FormData = {
            access_key:
              "0200f736-cd68-4ffa-aadc-55892755d561",

            subject:
              `Paid Order [${orderData.paymentId}] - Sinatra Headwear`,

            from_name:
              "Sinatra Headwear Store",

            PaymentId:
              orderData.paymentId,

            FullName:
              orderData.fullName,

            Email:
              orderData.email,

            Phone:
              orderData.phone,

            Address:
              orderData.address,

            Apartment:
              orderData.apartment,

            Suburb:
              orderData.suburb,

            City:
              orderData.city,

            Province:
              orderData.province,

            PostalCode:
              orderData.postalCode,

            OrderItems:
              orderData.orderItems,

            Subtotal:
              orderData.subtotal,

            ShippingFee:
              orderData.shippingFee,

            TotalAmount:
              orderData.totalAmount
          };

          const response =
            await fetch(
              "https://api.web3forms.com/submit",
              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json"
                },

                body:
                  JSON.stringify(
                    web3FormData
                  )
              }
            );

          const result =
            await response.json();

          console.log(
            "Web3Forms:",
            result
          );

          if (
            response.ok &&
            result.success
          ) {
            statusMsg.innerHTML =
              "Thank you! Your payment was successful and your order has been received.";

            localStorage.removeItem(
              "pendingSinatraOrder"
            );

            localStorage.removeItem(
              "sinatra_cart"
            );
          } else {
            console.error(
              "Web3Forms error:",
              result
            );

            statusMsg.innerHTML =
              "Your payment was successful. We received your order, but the order email could not be sent automatically.";
          }

        } catch (error) {
          console.error(
            "Order notification error:",
            error
          );

          statusMsg.innerHTML =
            "Your payment was successful. There was a problem sending the order notification.";
        }
      }
    );
  </script>

</body>
</html>
